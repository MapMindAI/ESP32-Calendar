name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP-IDF v5.5.2 / esp32s3
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore ESP-IDF dependencies
        uses: actions/cache@v4
        with:
          path: |
            managed_components
            .idf-component-cache
          key: esp-idf-v5.5.2-${{ runner.os }}-${{ hashFiles('dependencies.lock', 'main/idf_component.yml') }}

      - name: Build firmware
        env:
          IDF_COMPONENT_CACHE_PATH: ${{ github.workspace }}/.idf-component-cache
        run: . "$IDF_PATH/export.sh" && idf.py build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32-calendar-esp32s3
          if-no-files-found: error
          path: |
            build/esp32-calendar.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
